[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
libam = { path = "crates/libam" }
backend = { path = "crates/backend" }
# Diagnostics of libam and the daemon; the daemon binary installs the subscriber.
tracing = { version = "0.1", default-features = false, features = ["std"] }
